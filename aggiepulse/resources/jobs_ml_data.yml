resources:
  jobs:
    ml_data:
      name: aggiepulse-ml-data
      max_concurrent_runs: 1
      tasks:
        - task_key: simulate_and_build_features
          environment_key: ml_data
          spark_python_task:
            python_file: ../src/aggiepulse/features/job.py
            parameters:
              - --source-root
              - ${workspace.file_path}/src
              - --data-root
              - ${var.landing_root}
              - --seed-root
              - /Volumes/transit/raw/seeds
              - --catalog
              - ${var.catalog}
              - --seed
              - "42"
      environments:
        - environment_key: ml_data
          spec:
            environment_version: "4"
            dependencies:
              - ../dist/*.whl
              - h3==4.5.0
              - PyYAML==6.0.3
              - mlflow>=3.0,<4
