sync:
  include:
    - ../app/frontend/dist/**
resources:
  apps:
    aggiepulse:
      name: aggiepulse
      description: TAMU bus crowding forecasts
      source_code_path: ../app
      resources:
        - name: warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
        - name: live-vehicles
          uc_securable:
            securable_full_name: transit.raw.live
            securable_type: VOLUME
            permission: READ_VOLUME
